[project]
name = "regression-kit"
version = "0.1.0"
description = "A pytest plugin for running browser/e2e regression tests against a live, seeded, never-production copy of a web app."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pytest>=8"]

[project.entry-points.pytest11]
regression_kit = "regression_kit.plugin"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis",
    "pytest-xdist",
    "ruff",
    "pytest-playwright>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["regression_kit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
